name: FoundrAI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what's needed for tests — skip heavy ML packages
          pip install fastapi uvicorn pydantic pydantic-settings \
            python-jose[cryptography] passlib[bcrypt] \
            groq httpx supabase pypdf python-docx \
            numpy scipy pandas scikit-learn \
            python-multipart aiofiles python-dotenv \
            pytest pytest-asyncio pytest-cov faker
        env:
          PIP_NO_CACHE_DIR: "1"

      - name: Run tests
        run: pytest backend/tests/ -x -q --ignore=backend/tests/test_integration.py
        env:
          ENVIRONMENT: testing
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          SUPABASE_JWT_SECRET: "placeholder-secret-at-least-32-chars-long"
          GROQ_API_KEY: "placeholder"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
